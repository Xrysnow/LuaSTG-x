apply plugin: 'com.android.application'

android {
    namespace "org.cocos.game"
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    ndkVersion "30.0.16248370"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.xrysnow.lstgx"
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_FIND_ROOT_PATH=", "-DANDROID_STL=c++_shared", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_LD=gold"
                // Build-host tools and output paths use the same interface as
                // CMake. OpenSSL always builds the bundled source and profile.
                ["WORK_ROOT", "PERL", "MAKE", "JOBS", "RUNTIME_OPENSSLDIR",
                 "ANDROID_WINDOWS_HOST", "MSYS_ROOT", "PERL5LIB"].each { name ->
                    def value = project.findProperty("CC_OPENSSL_${name}")
                    if (value != null) {
                        arguments "-DCC_OPENSSL_${name}=${value}"
                    }
                }
                cppFlags "-frtti -fexceptions -fsigned-char -std=c++17"
            }
            ndk {
                abiFilters PROP_APP_ABI.split(':')
            }
        }

        ndk {
            abiFilters PROP_APP_ABI.split(':')
        }
    }

    sourceSets.main {
        java.srcDir "src"
        // Keep any old generated file on disk without compiling a second loader.
        java.exclude "org/lstgx/lib/SharedLoader.java"
        res.srcDir "res"
        jniLibs.srcDir "libs"
        manifest.srcFile "AndroidManifest.xml"
        // Legacy assets/ is retained locally; generated copies must not merge twice.
        assets.setSrcDirs(["manual-assets"])
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    externalNativeBuild {
        cmake {
            path "../../../../CMakeLists.txt"
            version "4.1.2"
        }
    }

    signingConfigs {

       release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            // renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            jniDebuggable true
            // renderscriptDebuggable true
            signingConfig signingConfigs.debug
        }
    }

    aaptOptions {
        noCompress 'mp3','ogg','wav','mp4','ttf','ttc'
    }
}

apply from: 'lstgx-assets.gradle'

dependencies {
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "../../../cocos-x/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libcocos2dx')
    //implementation project(':libcocos')
}

project.afterEvaluate {
    if (tasks.findByName("externalNativeBuildDebug")) {
        compileDebugJavaWithJavac.dependsOn externalNativeBuildDebug
    }
    if (tasks.findByName("externalNativeBuildRelease")) {
        compileReleaseJavaWithJavac.dependsOn externalNativeBuildRelease
    }
}
